    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      /* iOS browsers can restore both an obsolete document offset and a stale
         dynamic viewport after reload. Establish the shell contract before
         React mounts; keyboard-sized viewports are intentionally ignored. */
      (() => {
        let stableViewportHeight = 0;
        let keyboardSession = false;
        const syncViewport = (resetScroll = false) => {
          const visualHeight = Math.round(window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight || 0);
          const focused = document.activeElement;
          const editsText = focused instanceof HTMLElement && focused.matches('input, textarea, select, [contenteditable="true"]');
          if (editsText && visualHeight < stableViewportHeight - 4) keyboardSession = true;
          // iOS can keep the input focused after hiding the keyboard. Only the
          // viewport size, not focus alone, tells us whether scrolling may reset.
          const keyboardRecovering = keyboardSession && visualHeight < stableViewportHeight - 4;
          if (!keyboardRecovering && visualHeight > 0) {
            document.documentElement.style.setProperty('--xc-app-height', `${visualHeight}px`);
            stableViewportHeight = visualHeight;
            keyboardSession = false;
          }
          if (!resetScroll || keyboardRecovering) return;
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          if (document.body) document.body.scrollTop = 0;
        };

        if ('scrollRestoration' in window.history) window.history.scrollRestoration = 'manual';
        window.__syncFacsViewport = syncViewport;
        syncViewport(true);
        const syncAfterResume = () => {
          syncViewport(true);
          window.requestAnimationFrame(() => window.requestAnimationFrame(() => syncViewport(true)));
        };
        const syncViewportSize = () => {
          syncViewport(true);
          window.requestAnimationFrame(() => syncViewport(true));
        };
        window.addEventListener('pageshow', syncAfterResume);
        window.addEventListener('load', syncAfterResume, { once: true });
        window.addEventListener('focus', syncAfterResume);
        window.addEventListener('orientationchange', () => {
          if (!(document.activeElement instanceof HTMLElement && document.activeElement.matches('input, textarea, select, [contenteditable="true"]'))) {
            stableViewportHeight = 0;
            keyboardSession = false;
          }
          syncAfterResume();
        });
        document.addEventListener('focusin', () => syncViewport(false));
        document.addEventListener('focusout', () => {
          window.requestAnimationFrame(() => syncViewport(true));
          window.setTimeout(() => syncViewport(true), 350);
          window.setTimeout(() => syncViewport(true), 700);
        });
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') syncAfterResume();
        });
        window.addEventListener('resize', syncViewportSize);
        window.visualViewport?.addEventListener('resize', syncViewportSize);
        window.visualViewport?.addEventListener('scroll', syncViewportSize);

      })();
    </script>
